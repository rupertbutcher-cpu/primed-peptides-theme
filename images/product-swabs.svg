<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <rect width="300" height="300" fill="#f0f7fd"/>

  <!-- Dispenser box with foil sachets coming out of the top, which is what makes this read
       as swabs rather than as any other small carton. -->

  <!-- Sachets behind the box -->
  <g>
    <rect x="150" y="88" width="46" height="34" rx="3" fill="white" stroke="#c8e0f0" stroke-width="1.5" transform="rotate(-14 173 105)"/>
    <line x1="154" y1="96" x2="196" y2="86" stroke="#e8f4fb" stroke-width="2"/>
    <rect x="128" y="80" width="46" height="34" rx="3" fill="white" stroke="#c8e0f0" stroke-width="1.5" transform="rotate(6 151 97)"/>
    <circle cx="151" cy="97" r="7" fill="#e8f4fb"/>
  </g>

  <!-- Box body -->
  <path d="M84 120 h132 v100 a8 8 0 0 1 -8 8 h-116 a8 8 0 0 1 -8 -8 z" fill="white" stroke="#c8e0f0" stroke-width="2"/>
  <!-- Box top face -->
  <path d="M84 120 l18 -16 h132 l-18 16 z" fill="#e8f4fb" stroke="#c8e0f0" stroke-width="2"/>
  <!-- Box side face -->
  <path d="M216 120 l18 -16 v100 a8 8 0 0 1 -8 8 h-10 z" fill="#dceef9" stroke="#c8e0f0" stroke-width="2"/>

  <!-- Dispenser slot -->
  <rect x="118" y="112" width="64" height="7" rx="3.5" fill="#9fc8e0"/>

  <!-- Blue band -->
  <rect x="84" y="140" width="132" height="26" fill="#6bb5e3"/>
  <text x="150" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="1">70% IPA</text>

  <!-- Label block -->
  <text x="150" y="188" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#4a9fd4" letter-spacing="0.5">ALCOHOL SWABS</text>
  <rect x="106" y="196" width="88" height="3" rx="1.5" fill="#e8f4fb"/>
  <rect x="116" y="204" width="68" height="3" rx="1.5" fill="#e8f4fb"/>
  <text x="150" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="600" fill="#94b8cc" letter-spacing="2">PEPTIDES</text>

  <!-- Shine -->
  <rect x="90" y="126" width="8" height="96" rx="4" fill="white" opacity="0.5"/>
</svg>
