<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <rect width="300" height="300" fill="#f0f7fd"/>

  <!-- A PACK of vials, not one vial. Three vials in a tray says "pack of 10" far better than
       the single-vial placeholder this product was using, which was indistinguishable from
       the Bacteriostatic Water card sitting next to it. -->

  <!-- Back vial, left -->
  <g opacity="0.75">
    <rect x="74" y="96" width="52" height="106" rx="12" fill="white" stroke="#c8e0f0" stroke-width="2"/>
    <rect x="74" y="92" width="52" height="18" rx="7" fill="#8ecae6"/>
    <rect x="85" y="83" width="30" height="11" rx="3" fill="#a9d8ef"/>
    <rect x="76" y="132" width="48" height="66" rx="8" fill="#eef8fd"/>
  </g>

  <!-- Back vial, right -->
  <g opacity="0.75">
    <rect x="174" y="96" width="52" height="106" rx="12" fill="white" stroke="#c8e0f0" stroke-width="2"/>
    <rect x="174" y="92" width="52" height="18" rx="7" fill="#8ecae6"/>
    <rect x="185" y="83" width="30" height="11" rx="3" fill="#a9d8ef"/>
    <rect x="176" y="132" width="48" height="66" rx="8" fill="#eef8fd"/>
  </g>

  <!-- Front vial -->
  <rect x="120" y="84" width="60" height="122" rx="14" fill="white" stroke="#c8e0f0" stroke-width="2"/>
  <rect x="120" y="79" width="60" height="21" rx="8" fill="#4a9fd4"/>
  <rect x="126" y="76" width="48" height="14" rx="5" fill="#6bb5e3"/>
  <rect x="133" y="66" width="34" height="12" rx="4" fill="#8ecae6"/>
  <circle cx="150" cy="72" r="6" fill="#6bb5e3" stroke="white" stroke-width="1.5"/>
  <rect x="122" y="126" width="56" height="76" rx="9" fill="#eef8fd"/>

  <!-- Front label -->
  <rect x="127" y="116" width="46" height="66" rx="5" fill="white" stroke="#d6eaf7" stroke-width="1"/>
  <rect x="132" y="122" width="36" height="4" rx="2" fill="#6bb5e3"/>
  <text x="150" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#4a9fd4">10ml</text>
  <rect x="133" y="151" width="34" height="3" rx="1.5" fill="#e8f4fb"/>
  <text x="150" y="166" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" font-weight="600" fill="#94b8cc" letter-spacing="1.5">PEPTIDES</text>
  <rect x="133" y="172" width="34" height="2.5" rx="1.25" fill="#e8f4fb"/>

  <!-- Tray -->
  <path d="M64 202 h172 l-10 24 a8 8 0 0 1 -8 6 h-136 a8 8 0 0 1 -8 -6 z" fill="#dceef9" stroke="#c8e0f0" stroke-width="2"/>

  <!-- Pack count -->
  <text x="150" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#6bb5e3" letter-spacing="1">PACK OF 10</text>

  <!-- Shine -->
  <rect x="124" y="90" width="6" height="110" rx="3" fill="white" opacity="0.5"/>
</svg>
