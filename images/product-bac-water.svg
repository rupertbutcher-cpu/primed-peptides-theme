<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <rect width="300" height="300" fill="#f0f7fd"/>

  <!-- Same vial silhouette as product-vial.svg on purpose - it IS a vial - but filled to the
       shoulder with clear water and capped in a different colour, so the two are told apart
       on the grid at a glance rather than by reading the product name. -->

  <!-- Vial body -->
  <rect x="112" y="80" width="76" height="140" rx="16" fill="white" stroke="#c8e0f0" stroke-width="2"/>

  <!-- Water fill, higher than the peptide vial -->
  <rect x="114" y="104" width="72" height="114" rx="10" fill="#dcf0fa"/>
  <path d="M114 108 q18 -7 36 0 t36 0 v8 q-18 7 -36 0 t-36 0 z" fill="#c2e5f6"/>

  <!-- Rubber stopper -->
  <rect x="112" y="75" width="76" height="24" rx="8" fill="#3d8bbf"/>
  <rect x="118" y="72" width="64" height="16" rx="6" fill="#57a6d8"/>

  <!-- Metal crimp cap -->
  <rect x="128" y="63" width="44" height="14" rx="4" fill="#8ecae6"/>
  <circle cx="150" cy="69" r="8" fill="#3d8bbf" stroke="white" stroke-width="2"/>
  <circle cx="150" cy="69" r="4" fill="white"/>

  <!-- Label -->
  <rect x="120" y="120" width="60" height="74" rx="6" fill="white" stroke="#d6eaf7" stroke-width="1"/>
  <rect x="126" y="127" width="48" height="5" rx="2" fill="#3d8bbf"/>

  <text x="150" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#3d8bbf" letter-spacing="0.5">BAC</text>
  <text x="150" y="163" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#3d8bbf" letter-spacing="0.5">WATER</text>
  <rect x="128" y="170" width="44" height="3" rx="1.5" fill="#e8f4fb"/>
  <text x="150" y="186" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" font-weight="600" fill="#94b8cc" letter-spacing="2">PEPTIDES</text>

  <!-- Measurement lines -->
  <line x1="113" y1="125" x2="109" y2="125" stroke="#c8e0f0" stroke-width="1"/>
  <line x1="113" y1="145" x2="109" y2="145" stroke="#c8e0f0" stroke-width="1"/>
  <line x1="113" y1="165" x2="109" y2="165" stroke="#c8e0f0" stroke-width="1"/>
  <line x1="113" y1="185" x2="109" y2="185" stroke="#c8e0f0" stroke-width="1"/>

  <!-- Shine -->
  <rect x="116" y="85" width="7" height="128" rx="3" fill="white" opacity="0.45"/>
</svg>
